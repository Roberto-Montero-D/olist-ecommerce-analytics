[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-ecommerce-analytics"
version = "0.1.0"
description = "Python analytics utilities for the Olist e-commerce analytics project."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["src*"]