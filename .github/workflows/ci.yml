name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Ruff lint
        run: ruff check src tests

      - name: Run Python unit tests
        run: pytest -q tests/test_audit_raw_data.py tests/test_database.py

  markdown-quality:
    name: Markdown quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyMarkdown
        run: pip install pymarkdownlnt

      - name: Lint Markdown
        shell: bash
        run: |
          git ls-files -z "*.md" |
            xargs -0 -n 1 pymarkdown --config .pymarkdown scan

  warehouse-integration:
    name: Warehouse integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: olist_test
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: olist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olist -d olist_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: olist_test
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Run warehouse integration tests
        run: pytest -q tests/test_warehouse_integration.py